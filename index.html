<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  try {
    var savedLang = localStorage.getItem('aperio-lang');
    if (savedLang === 'en' || savedLang === 'ar') {
      location.replace(savedLang + '/index.html');
    }
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperio — اختر لغتك / Choose your language</title>
<meta name="description" content="Aperio — Your work, seen the way you intended it to be seen. Choose English or Arabic to continue.">
<meta name="theme-color" content="#14120F">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/images/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/images/favicon-180.png">
<link rel="manifest" href="assets/manifest.json">
<link rel="alternate" hreflang="en" href="en/index.html">
<link rel="alternate" hreflang="ar" href="ar/index.html">
<link rel="alternate" hreflang="x-default" href="index.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Cairo:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="gate">
<div class="page-transition-overlay" aria-hidden="true"></div>

<main class="gate-screen">
  <img class="gate-mark" src="assets/images/mark-paper.png" alt="Aperio" width="60" height="54">

  <div class="gate-choices" role="group" aria-label="Choose your language / اختر لغتك">
    <a class="gate-btn" href="en/index.html" data-set-lang="en">
      <span class="gate-btn-label" lang="en">English</span>
      <span class="gate-btn-sub">CONTINUE IN ENGLISH</span>
    </a>
    <a class="gate-btn" href="ar/index.html" data-set-lang="ar">
      <span class="gate-btn-label" lang="ar" dir="rtl">العربية</span>
      <span class="gate-btn-sub">المتابعة بالعربية</span>
    </a>
  </div>

  <div class="gate-foot">APERIO™ — EST. 2026</div>
</main>

<script src="assets/js/main.js" defer></script>
</body>
</html>
